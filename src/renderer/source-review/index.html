<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>润石 · 原文建议</title><link rel="stylesheet" href="style.css"></head>
<body><div id="marks" aria-hidden="true"></div>
<article id="card" hidden aria-label="原文修订意见">
 <header><span id="category">修订建议</span><button id="close" aria-label="关闭建议">×</button></header>
 <p id="old"></p><button id="accept" title="接受并替换这一处原文"></button>
 <p id="reason"></p><p id="status" role="status"></p>
 <footer><button id="ignore">忽略此处</button><button id="results">返回润石结果窗 ↗</button></footer>
</article><script src="script.js"></script></body></html>
