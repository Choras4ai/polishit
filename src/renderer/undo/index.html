<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>润石回档</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="undo-shell">
    <button class="undo-chip" id="undoChip" title="点击回档刚刚的润色内容">
      <span class="undo-logo">润</span>
      <span class="undo-copy">
        <span class="undo-title">已替换原文</span>
        <span class="undo-subtitle">点击小 logo 回档刚刚的润色内容</span>
      </span>
    </button>
    <button class="undo-close" id="btnClose" title="关闭">×</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
