<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>润石 PoliShit 工具栏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar" id="toolbar">
    <span class="toolbar-caret" aria-hidden="true"></span>
    <div class="toolbar-inner">
      <button class="tool-btn" id="btnPolish" data-task="polish">
        <span class="tool-icon tool-icon-brand">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.4c.45 3.3 2.3 5.15 5.6 5.6C10.3 7.45 8.45 9.3 8 12.6 7.55 9.3 5.7 7.45 2.4 7 5.7 6.55 7.55 4.7 8 1.4Z" fill="currentColor"/><path d="M12.7 10.4c.16 1.2.84 1.88 2.05 2.05-1.21.17-1.89.85-2.05 2.05-.17-1.2-.85-1.88-2.05-2.05 1.2-.17 1.88-.85 2.05-2.05Z" fill="currentColor"/></svg>
        </span>
        <span class="tool-copy"><span class="tool-label">润色</span><span class="tool-hint">修改表达与语病</span></span>
      </button>
      <div class="tool-divider"></div>
      <button class="tool-btn" id="btnDeAI" data-task="deai">
        <span class="tool-icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3.5h10M3 7.8h7M3 12.1h8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m11.4 8.7.8 1.05 1.3-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="tool-copy"><span class="tool-label">自然化</span><span class="tool-hint">调整机械表达</span></span>
      </button>
      <div class="tool-divider"></div>
      <button class="tool-btn tool-btn-menu" id="btnMenu" title="更多选项（或右键点击）">
        <span class="tool-icon menu-dots">•••</span>
      </button>
    </div>
  </div>
  <!-- Context menu (right-click or ⋯ button) -->
  <div class="context-menu hidden" id="contextMenu">
    <button class="ctx-item" id="ctxSettings">偏好设置</button>
    <button class="ctx-item ctx-item-muted" id="ctxCloseToolbar">暂停选中浮窗</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
