name: Sync verified desktop installers
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to mirror'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-sync-${{ inputs.version }}
jobs:
  mirror:
    if: github.repository == 'Choras4ai/polishit'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Verify official packages and publish the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/sync.py
