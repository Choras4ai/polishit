<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><defs><radialGradient id="g"><stop stop-color="#dce6d1"/><stop offset="1" stop-color="#f5f6ee"/></radialGradient><filter id="s" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#304c34" flood-opacity=".12"/></filter></defs><rect width="1200" height="460" rx="18" fill="#f5f6ee"/><circle cx="890" cy="210" r="230" fill="url(#g)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="64" y="67" font-size="19" fill="#4e6355" letter-spacing="5">润石 · POLISHIT</text><text x="64" y="166" font-size="52" fill="#293f30" font-family="Songti SC,STSong,serif">让文字，</text><text x="64" y="242" font-size="52" fill="#5c7a60" font-family="Songti SC,STSong,serif">在原处变好。</text><text x="67" y="293" font-size="15" fill="#7e8a74">中文润色 · 自然化表达 · 逐条审阅</text><rect x="64" y="333" width="191" height="45" rx="5" fill="#4e6355"/><text x="89" y="361" font-size="13" fill="white">macOS / Windows　↓</text><text x="65" y="419" font-size="11" fill="#8b9781" letter-spacing="1">润色构石，构石虽糙，一润成文。</text><g transform="translate(605 54) rotate(-3 230 170)" filter="url(#s)"><rect width="456" height="307" rx="10" fill="#fffdf9" stroke="#dce3d3"/><path d="M0 43H456" stroke="#e2e7db"/><rect x="19" y="13" width="22" height="20" rx="2" fill="#496b86"/><text x="24" y="28" font-size="14" fill="white">W</text><text x="52" y="28" font-size="11" fill="#8a9480">我的文稿.docx</text><text x="35" y="99" font-size="10" letter-spacing="2" fill="#98a28c">细微修改，让想法更清晰。</text><text x="35" y="150" font-size="23" fill="#344d37" font-family="serif">每个想法，都值得被准确表达。</text><text x="35" y="192" font-size="14" fill="#7c8874">我们希望提高响应时间，让等待更短。</text><path d="M101 201H213" stroke="#d1ad65" stroke-width="3"/><path d="M35 230H346M35 250H301" stroke="#e8ece1" stroke-width="4"/></g><g transform="translate(809 245)" filter="url(#s)"><rect width="300" height="164" rx="11" fill="#fbfef8" stroke="#ccdac7"/><circle cx="22" cy="23" r="3" fill="#85a276"/><text x="35" y="27" font-size="11" fill="#6b8462">用词精确</text><text x="23" y="59" font-size="12" fill="#b08c7e">提高响应时间</text><path d="M23 55H111" stroke="#b08c7e"/><rect x="15" y="72" width="270" height="39" rx="4" fill="#e5eedf"/><text x="25" y="98" font-size="18" fill="#3b6347">缩短响应时间　　　　　 ↵</text><text x="24" y="140" font-size="11" fill="#8b9780">时间应“缩短”，速度才是“提高”。</text></g></g></svg>
