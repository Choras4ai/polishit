<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐星 · 静态视错觉</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f2f3ef;color:#4f6155;font-family:Arial,'PingFang SC',sans-serif}main{max-width:1000px;margin:auto}h1{font-size:24px;font-weight:400}p{line-height:1.9;font-size:14px;max-width:700px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.pair img{width:100%;display:block}.dark{background:#4f6155}.dark img{filter:brightness(0) invert(1)}a{color:inherit}@media(max-width:600px){.pair{grid-template-columns:1fr}}</style><main><h1>隐星 / 纯静态图形</h1><p>四片墨绿色形状留下不完整的星形边缘。观察中央时，尝试看到一颗覆盖在四片形状前面的完整星。中央没有单独的颜色、描边或阴影；它和外部是同一片背景。这是基于主观轮廓的品牌实验，错觉强度因人而异。</p><div class="pair"><img src="iterations/star-gap-illusory-static.svg" alt="午夜绿隐星"><div class="dark"><img src="iterations/star-gap-illusory-static.svg" alt="反白隐星"></div></div><p><a href="iterations/star-gap-illusory-static.svg">下载静态 SVG</a></p></main></html>
